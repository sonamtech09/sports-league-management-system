<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SLMS | Sign Up</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <main class="auth-shell compact">
    <section class="auth-brand">
      <div class="brand-mark">SL</div>
      <p class="eyebrow">CREATE ACCOUNT</p>
      <h1>Join the<br>League</h1>
      <p class="brand-copy">Register as a user and explore teams, fixtures, results and standings.</p>
      <a class="text-link light-link" href="index.html">← Back to login</a>
    </section>

    <section class="auth-card">
      <div class="auth-heading">
        <p class="eyebrow">USER MODULE</p>
        <h2>Sign up</h2>
        <p>Your account is stored locally in the browser.</p>
      </div>

      <form id="signupForm" class="form-grid">
        <label>Full Name
          <input id="signupName" type="text" placeholder="Your name" required>
        </label>
        <label>Email
          <input id="signupEmail" type="email" placeholder="you@example.com" required>
        </label>
        <label>Password
          <input id="signupPassword" type="password" minlength="6" placeholder="Minimum 6 characters" required>
        </label>
        <label>Confirm Password
          <input id="signupConfirm" type="password" minlength="6" placeholder="Re-enter password" required>
        </label>
        <button class="btn btn-primary" type="submit">Create Account</button>
        <p id="signupMessage" class="form-message"></p>
      </form>

      <p class="auth-switch">Already registered? <a href="index.html">Login here</a></p>
    </section>
  </main>
  <script src="app.js"></script>
  <script>
    initSignupPage();
  </script>
</body>
</html>
